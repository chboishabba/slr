name: Rust direct-delta checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: clippy

      - name: Unit tests
        run: cargo test --workspace

      - name: Offline proof-search fixture
        run: cargo run -p sensiblaw-proof-search-scheduler --example offline_pabai

      - name: Offline proof-search frontier loop
        run: cargo run -p sensiblaw-proof-search-loop --example offline_pabai_loop

      - name: Offline research engine v0.1
        run: cargo run -p sensiblaw-proof-search-loop --example offline_research_engine_v01

      - name: Legal runtime capstone M2.5 through Sprint 8
        run: |
          rm -rf /tmp/legal-runtime-capstone
          cargo test -p sensiblaw-legal-runtime
          cargo run -p sensiblaw-legal-runtime --example legal_runtime_capstone -- /tmp/legal-runtime-capstone
          test -s /tmp/legal-runtime-capstone/m2_5_mixed_family_replay.tsv
          for matter in mabo pabai cullennswcla glj; do
            test -s "/tmp/legal-runtime-capstone/$matter.legal-campaign.tsv"
            test -s "/tmp/legal-runtime-capstone/$matter.m4a-workbench.txt"
            test -s "/tmp/legal-runtime-capstone/$matter.m6-explanation.txt"
            for projection in sourceview timeline issueproof entityrelationship citationauthority flow comparative; do
              test -s "/tmp/legal-runtime-capstone/$matter.m7-$projection.txt"
            done
            test -s "/tmp/legal-runtime-capstone/$matter.m8-runtime.txt"
          done
          test -s /tmp/legal-runtime-capstone/mann.m8-unseen-contract-runtime.txt
          test -s /tmp/legal-runtime-capstone/waltons.estoppel-follow-trace.txt
          grep -q 'capability.*m2_5=true.*m3_a=true.*m3_b=true.*m3_c=true.*m3_c_replay=true.*m4_a=true.*m6=true.*m6_reverse=true.*m7=true.*m7_identity=true.*s8=true.*s8_reducer=true.*s8_reader=true.*s8_unseen_contract=true.*s8_contract_follow=true.*candidate_only=true.*semantic_authority=false' /tmp/legal-runtime-capstone/capability-report.tsv

      - name: Native LegalFollow CLI smoke
        run: |
          rm -rf /tmp/waltons-native-cli
          cargo run -p sensiblaw-cli --bin sensiblaw -- legal-follow waltons --base /tmp/waltons-native-cli status
          cargo test -p sensiblaw-governed-legal-provider
          cargo test -p sensiblaw-cli
          cargo run -p sensiblaw-cli --bin sensiblaw -- legal-follow contracts landscape status --as-at 2026-09-20 --jurisdiction AU-QLD
          cargo run -p sensiblaw-cli --bin sensiblaw -- legal-follow contracts landscape plan --as-at 2026-09-20 --jurisdiction AU-QLD --output /tmp/contracts-landscape-qld.json
          test -s /tmp/contracts-landscape-qld.json
          grep -q '"bounded_seed_only": true' /tmp/contracts-landscape-qld.json
          grep -q '"creates_current_law_conclusion": false' /tmp/contracts-landscape-qld.json
          grep -q 'legislation:qld:property-law-act-1974:s55' /tmp/contracts-landscape-qld.json
          grep -q 'legislation:qld:property-law-act-2023:s68' /tmp/contracts-landscape-qld.json
          cargo check -p sensiblaw-cli --features live-network
          cargo check -p sensiblaw-governed-legal-provider --features live-network --examples

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Source-contract checks
        run: |
          python3 scripts/verify_source_contract.py
          python3 scripts/verify_semantic_status_contract.py
          python3 scripts/verify_legal_counterfactual_contract.py
          python3 scripts/verify_proof_search_scheduler_contract.py
          python3 scripts/verify_proof_search_loop_contract.py
          python3 scripts/verify_offline_research_engine_contract.py

      - name: Python syntax checks
        run: >-
          python3 -m py_compile
          python/spacy_stream.py
          python/gwb_tranche.py
          python/gwb_prepare.py
          python/gwb_full_run.py
          python/gwb_certify.py
          python/gwb_expanded_certify.py
          scripts/bench_stream.py
          scripts/verify_source_contract.py
          scripts/verify_semantic_status_contract.py
          scripts/verify_legal_counterfactual_contract.py
          scripts/verify_proof_search_scheduler_contract.py
          scripts/verify_proof_search_loop_contract.py
          scripts/verify_offline_research_engine_contract.py
          scripts/waltons_pipeline.py
          scripts/waltons_review_decision_template.py
          scripts/waltons_review_decision_finalize.py
          scripts/waltons_cited_by_import.py
          scripts/waltons_cited_by_oalc_worklist.py
          scripts/merge_treatment_review_queues.py
          scripts/citation_treatment_review_template.py
          scripts/citation_treatment_review_finalize.py
          script/stream_oalc_exact_record.py
          script/run_cullen_oalc_pnf.py
