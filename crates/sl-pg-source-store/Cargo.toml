[package]
name = "sensiblaw-pg-source-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sensiblaw-core = { path = "../sl-core" }
sensiblaw-reader-model = { path = "../sl-reader-model" }
dotenvy = "0.15"
postgres = "0.19"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
sensiblaw-legal-runtime = { path = "../sl-legal-runtime" }
sensiblaw-evidence-payment = { path = "../sl-evidence-payment" }
tempfile = "3"
