[package]
name = "sensiblaw-proof-search-loop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sensiblaw-core = { path = "../sl-core" }
sensiblaw-proof-search-scheduler = { path = "../sl-proof-search-scheduler" }
sensiblaw-evidential-reopen = { path = "../sl-evidential-reopen" }
sensiblaw-governed-legal-provider = { path = "../sl-governed-legal-provider" }
sensiblaw-nsw-legislation-provider = { path = "../sl-nsw-legislation-provider" }
sensiblaw-reader-model = { path = "../sl-reader-model" }
sensiblaw-route-executor = { path = "../sl-route-executor" }
sensiblaw-route-selector = { path = "../sl-route-selector" }
sensiblaw-wikimedia-candidate-provider = { path = "../sl-wikimedia-candidate-provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
xml-rs = "0.8"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
