[package]
name = "sensiblaw-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sensiblaw"
path = "src/main.rs"

[features]
default = []
live-network = ["sensiblaw-governed-legal-provider/live-network"]

[dependencies]
sensiblaw-legal-follow-plan = { path = "../sl-legal-follow-plan" }
sensiblaw-governed-legal-provider = { path = "../sl-governed-legal-provider" }
sensiblaw-legal-runtime = { path = "../sl-legal-runtime" }
sensiblaw-proof-search-loop = { path = "../sl-proof-search-loop" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
